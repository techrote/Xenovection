name: Windows evaluator

on:
  push:
    branches: [docs/xenovection-founding-charter, feature/synth-002-visual-instrument, integration/mainline-convergence-001]
    paths: [app/**, tests/**, tools/**, packaging/**, .gitattributes, .github/workflows/evaluator.yml]
  pull_request:
    branches: [main]
    paths: [app/**, tests/**, tools/**, packaging/**, .gitattributes, .github/workflows/evaluator.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # Integration work checkpoints stay cheap; [qualify] pushes run the complete
    # exact-source campaign. No inherited test is skipped within that campaign.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref != 'integration/mainline-convergence-001') ||
      (github.event_name == 'push' && (github.ref_name != 'integration/mainline-convergence-001' || contains(github.event.head_commit.message, '[qualify]')))
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .runtime
          key: xenovection-windows-godot-4.7.2-mesa-26.3.1-v1
      - name: Build and qualify exact evaluator
        shell: pwsh
        run: ./tools/windows_evaluator.ps1
      - name: Upload application and qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xenovection-Windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/Xenovection-MAINLINE-CONVERGENCE-001-Windows-*.zip
            build/package-receipt.json
            build/windows-evidence/**
          if-no-files-found: error
          retention-days: 30
